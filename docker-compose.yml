services:
  postgres:
    image: postgres:17
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: kv
      POSTGRES_PASSWORD: kv
      POSTGRES_DB: kv
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kv -d kv"]
      interval: 2s
      timeout: 5s
      retries: 20

  server:
    image: kv-store
    build: .
    environment:
      DATASTORE_TYPE: ${DATASTORE_TYPE:-MEMORY}
      ENCRYPTION_ALGORITHM: AES_GCM
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: kv
      POSTGRES_PASSWORD: kv
      POSTGRES_DB: kv
      POSTGRES_SSL_MODE: disable
      POSTGRES_RETRY: "10"
      POSTGRES_RETRY_DELAY: 2s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
        required: false

volumes:
  pgdata:
